name: Home pre-armado

# Genera, por servidor, un Home pre-armado (plan + filas + hero) y lo publica en home/<serverKey>.json. El plugin lo baja
# y pinta su Home al instante (si falta o está viejo, cae a la carga en vivo progresiva). Dos veces al día.
on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"  # 6 veces al día (cada 4h): Home fresco y lista de servidores sanos (index.json) al día
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home
  cancel-in-progress: false

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar el Home de cada servidor
        env:
          KINO_TMDB_KEY: ${{ secrets.KINO_TMDB_KEY }}
        run: node scripts/gen-home.mjs

      - name: Publicar si cambió algo
        run: |
          if git diff --quiet home; then
            echo "sin cambios en home/"
            exit 0
          fi
          git config user.name "xuper-plugin"
          git config user.email "335105665+xuper-plugin@users.noreply.github.com"
          git add home
          git commit -m "Home pre-armado: actualiza home/<serverKey>.json"
          git push origin HEAD:main
