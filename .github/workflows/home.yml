name: Home pre-armado

# Genera, por servidor, un Home pre-armado (plan + filas + hero) y lo publica en home/<serverKey>.json. El plugin lo baja
# y pinta su Home al instante (si falta o está viejo, cae a la carga en vivo progresiva).
on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"  # 6 veces al día (cada 4h)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home
  cancel-in-progress: false

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar el Home de cada servidor
        env:
          KINO_TMDB_KEY: ${{ secrets.KINO_TMDB_KEY }}
          FEED_KEY: ${{ secrets.FEED_KEY }}
        run: node scripts/gen-home.mjs

      - name: Publicar si cambió algo
        run: |
          # quita los .json planos viejos por servidor (ahora se publica solo .enc.json); conserva index.json y los .enc.json
          find home live -maxdepth 1 -name '*.json' ! -name '*.enc.json' ! -name 'index.json' -delete 2>/dev/null || true
          git add -A home live
          if git diff --cached --quiet; then
            echo "sin cambios en home/ ni live/"
            exit 0
          fi
          git config user.name "xuper-plugin"
          git config user.email "335105665+xuper-plugin@users.noreply.github.com"
          git commit -m "Home pre-armado: actualiza home/<serverKey>.enc.json"
          git pull --rebase origin main
          git push origin HEAD:main
