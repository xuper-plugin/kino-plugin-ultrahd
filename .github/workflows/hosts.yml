name: Servidores sanos

# Prueba los servidores del servicio y deja en kino-plugin.json los que responden (Kino solo permite HTTP con hosts declarados).
on:
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosts
  cancel-in-progress: false

jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probar servidores y actualizar el manifiesto
        run: node scripts/health-hosts.mjs

      - name: Validar el manifiesto
        run: node sdk/validate.mjs .

      - name: Publicar si cambió algo
        run: |
          if git diff --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git config user.name "xuper-plugin"
          git config user.email "335105665+xuper-plugin@users.noreply.github.com"
          git add kino-plugin.json package.json hosts-state.json
          git commit -m "Servidores sanos: actualiza los hosts declarados"
          git push origin HEAD:main
