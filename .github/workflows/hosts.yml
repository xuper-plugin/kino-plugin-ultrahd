name: Servidores sanos

# Probes the service's servers and declares in kino-plugin.json the hosts the plugin needs (Kino only lets plain HTTP reach
# declared hosts): the declared ones the service still lists, plus a new one only when it answered and the plugin uses it.
# The version never changes here: the author signature covers the id, the version and plugin.js, not `hosts`, so this job
# needs no signing key. New installs get the list at once; installed copies get it with the next signed release (npm run
# release, on the owner's machine), which then asks every person to approve each added host before it updates.
# Run by hand only: a scheduled run before the release that carries this job is out would make that release wait for
# approval on every device. Once it is out, a daily run can go back in (`schedule: - cron: "43 8 * * *"`).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosts
  cancel-in-progress: false

jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe the servers and update the declared hosts (version untouched)
        run: node scripts/health-hosts.mjs --probes-out "$RUNNER_TEMP/probes.json"

      - name: Validate (the signature still holds: plugin.js and the version are unchanged)
        run: node sdk/validate.mjs .

      - name: Publish if something changed
        run: |
          if [ -z "$(git status --porcelain -- kino-plugin.json hosts-state.json)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "xuper-plugin"
          git config user.email "335105665+xuper-plugin@users.noreply.github.com"
          git add kino-plugin.json hosts-state.json
          git commit -m "Healthy servers: update the declared hosts (version unchanged)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && exit 0
            else
              # Another commit touched kino-plugin.json (a new signed release): recompute on top of main from the same
              # answers, without probing the servers again.
              git rebase --abort || true
              git reset --hard origin/main
              node scripts/health-hosts.mjs --probes-in "$RUNNER_TEMP/probes.json"
              node sdk/validate.mjs .
              if [ -z "$(git status --porcelain -- kino-plugin.json hosts-state.json)" ]; then echo "no changes after recomputing"; exit 0; fi
              git add kino-plugin.json hosts-state.json
              git commit -m "Healthy servers: update the declared hosts (version unchanged)"
            fi
          done
          echo "could not publish after 3 attempts"
          exit 1
